<!DOCTYPE html>
<html lang="kk">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Бұл Сөзділ ойыны. Туиттерде мәшһүр болып кеткен Wordle ойынының қазақша нұсқасы"
    />
    <!--  Essential META Tags -->
    <meta property="og:title" content="Сөзділ | Қазақша Wordle">
    <meta property="og:type" content="article"/>
    <meta property="og:image" content="%PUBLIC_URL%/media.png">
    <meta property="og:url" content="https://wordle.kz">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="4c968575-d493-44c5-a174-f919ddeb6dbc"
    ></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8675457617835739"
     crossorigin="anonymous"></script>
    <script defer
      src='https://static.cloudflareinsights.com/beacon.min.js'
      data-cf-beacon='{"token": "12f542d63c394126b496cf8c26b28efa"}'></script>

    <!-- Jumbaq app funnel.
         The native Smart App Banner handles iOS Safari; app-argument points at
         /open, which the app claims as a Universal Link when installed and which
         otherwise 302s to jmbq.kz/sozdil with UTMs attached. -->
    <meta name="apple-itunes-app"
          content="app-id=6763323078, app-argument=https://wordle.kz/open">
    <!-- The banner covers Android and non-Safari iOS; it deliberately skips iOS
         Safari so it never doubles up with the meta tag above. -->
    <script defer src="https://jmbq.kz/banner.js" data-game="sozdil"></script>

    <title>Сөзділ | Қазақша Wordle</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
